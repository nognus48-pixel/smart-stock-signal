name: Archive daily stock picks
on:
  workflow_dispatch:
  schedule:
    - cron: '35 0 * * 2-6' # 09:35 Asia/Seoul, Tuesday–Saturday
permissions:
  contents: write
concurrency:
  group: daily-stock-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh market data
        run: |
          python update_signals.py
          python update_picks.py
      - name: Archive and optionally publish once
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python archive_daily.py
      - name: Save current and historical data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/market.json docs/picks.json docs/history/ || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive daily stock screen"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
