name: Update market signals
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * 1-5'
permissions:
  contents: write
concurrency:
  group: update-market
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Update index signals
        run: python update_signals.py
      - name: Update stock picks
        run: python update_picks.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/market.json docs/picks.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update market signals and picks"
          # Sync any commits that arrived during the market-data calculation.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then
              echo "Market data published successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Push failed after five attempts"
          exit 1
