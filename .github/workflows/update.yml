
name: Update market signals

on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python update_signals.py
      - name: Commit calculated signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/market.json
          git diff --cached --quiet || (git commit -m "Update market signals" && git push)
